name: Layout viewer RHI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pyedb/viewer/**'
      - 'tests/**/test_layout_viewer*'
      - 'tests/unit/test_viewer_build.py'
      - 'tools/bake_viewer_shaders.py'
      - '_build_backend/**'
      - 'pyproject.toml'
      - '.github/workflows/viewer-rhi.yml'

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
        qt: ['6.8.3', 'latest']
    env:
      PYEDB_VIEWER_RHI_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Linux presentation and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0
      - name: Install Python dependencies
        shell: bash
        env:
          QT_VERSION: ${{ matrix.qt }}
        run: |
          if [ "$QT_VERSION" = latest ]; then
            python -m pip install '.[viewer]' pytest pytest-rerunfailures 'flit_core>=3.11,<5'
          else
            python -m pip install '.[viewer]' "PySide6==$QT_VERSION" pytest pytest-rerunfailures 'flit_core>=3.11,<5'
          fi
      - name: Verify shader packaging
        run: python -m pytest tests/unit/test_viewer_build.py --reruns=0 -q
      - name: Test Vulkan on Linux X11
        if: runner.os == 'Linux'
        env:
          PYEDB_VIEWER_BACKEND: vulkan
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a sh -c 'vulkaninfo --summary && python -m pytest \
            tests/unit/test_layout_viewer.py \
            tests/unit/test_layout_viewer_rhi.py \
            tests/integration/test_layout_viewer_rhi.py \
            --reruns=0 -q'
      - name: Test Direct3D on Windows
        if: runner.os == 'Windows'
        env:
          PYEDB_VIEWER_BACKEND: d3d11
        run: >-
          python -m pytest tests/unit/test_layout_viewer.py
          tests/unit/test_layout_viewer_rhi.py tests/integration/test_layout_viewer_rhi.py
          --reruns=0 -q
